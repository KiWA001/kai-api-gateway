<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-AI API Docs</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #09090b;
      color: #fafafa;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 980px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: 0; }
    p { color: #a1a1aa; line-height: 1.6; }
    section {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid #2f2f36;
      border-radius: 8px;
      background: #18181b;
    }
    pre {
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #2f2f36;
      background: #0f0f14;
      color: #c4b5fd;
    }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>K-AI API Docs</h1>
    <p>Use OpenAI-compatible chat completions with the enabled CLI OAuth models configured by the admin.</p>

    <section>
      <h2>Chat</h2>
      <pre>POST /v1/chat/completions

{
  "model": "codex-gpt-5.5",
  "messages": [
    { "role": "user", "content": "Hello" }
  ]
}</pre>
    </section>

    <section>
      <h2>Models</h2>
      <pre>GET /models</pre>
    </section>
  </main>
</body>
</html>
