<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090b">
    <title>K-AI API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --surface-hover: #27272a;
            --border: #3f3f46;
            --text: #fafafa;
            --text-secondary: #a1a1aa;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .card-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: transparent; color: var(--error); border: 1px solid var(--error); }

        .table-container { overflow-x: auto; margin-top: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th { text-align: left; padding: 12px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
        td { padding: 12px; border-bottom: 1px solid var(--border); }

        /* Provider Grid */
        .provider-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .provider-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .provider-card {
            padding: 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .provider-card.active {
            border-color: var(--accent);
            background: var(--surface-hover);
        }

        .provider-card strong { display: block; font-size: 0.9375rem; }
        .provider-card span { font-size: 0.75rem; color: var(--text-secondary); }

        /* URL Input Row */
        .url-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .url-row { grid-template-columns: 1fr; }
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.875rem;
            font-family: inherit;
            resize: none;
        }

        .status-box {
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 16px;
            display: none;
        }

        .toggle-switch { position: relative; width: 44px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); border-radius: 24px; transition: .3s; }
        .toggle-slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s; }
        input:checked+.toggle-slider { background-color: var(--success); }
        input:checked+.toggle-slider:before { transform: translateX(20px); }

        .header-actions { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }

        .model-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .model-tag { 
            padding: 4px 10px; 
            background: var(--bg); 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            font-size: 0.75rem; 
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .model-tag:hover { border-color: var(--accent); color: var(--text); background: var(--surface-hover); }
    </style>
</head>

<body>
    <div class="app-container">
        <header>
            <h1>K-AI API</h1>
            <div class="header-actions">
                <div class="status-dot"></div>
                <span style="font-size:0.875rem;color:var(--text-secondary);">Active</span>
            </div>
        </header>

        <div class="card">
            <div class="card-header">
                <div>
                    <div class="card-title">OAuth Sessions</div>
                    <div class="card-subtitle">Manage connected authentication sessions</div>
                </div>
                <button class="btn btn-secondary" onclick="loadCliAuthFiles()">Refresh</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Active</th>
                            <th>Provider</th>
                            <th>Account</th>
                            <th>Cooldown</th>
                        </tr>
                    </thead>
                    <tbody id="cli-auth-sessions-table">
                        <tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-secondary);">Loading sessions...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div>
                    <div class="card-title">Add OAuth Session</div>
                    <div class="card-subtitle">Select a provider and follow the login steps</div>
                </div>
            </div>
            
            <div class="provider-grid" id="provider-grid">
                <!-- Populated by JS -->
            </div>

            <div id="cli-auth-status" class="status-box"></div>

            <div class="url-row">
                <div>
                    <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:6px;">LOGIN URL</div>
                    <textarea id="cli-auth-url" class="input-field" rows="3" readonly placeholder="Click 'Start Login' to generate"></textarea>
                    <div style="display:flex;gap:8px;margin-top:8px;">
                        <button class="btn btn-primary" style="flex:1" onclick="startCliAuth()">Start Login</button>
                        <button class="btn btn-secondary" onclick="copyCliAuthUrl()">Copy</button>
                    </div>
                </div>
                <div>
                    <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:6px;">REDIRECT URL</div>
                    <textarea id="cli-redirect-url" class="input-field" rows="3" placeholder="Paste the final redirect URL here"></textarea>
                    <div style="display:flex;gap:8px;margin-top:8px;">
                        <button class="btn btn-secondary" style="flex:1" onclick="pasteCliRedirectUrl()">Paste</button>
                        <button class="btn btn-success" style="flex:1" onclick="submitCliRedirect()">Submit</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div>
                    <div class="card-title">Test API</div>
                    <div class="card-subtitle">Test your connection using a CURL example</div>
                </div>
            </div>
            <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:8px;">
                <div style="font-size:0.75rem;color:var(--text-secondary);">CURL EXAMPLE</div>
                <div onclick="renderCurl()" style="cursor:pointer; color:var(--text-secondary); height:16px;" title="Reset CURL">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                </div>
            </div>
            <textarea id="curl-example" class="input-field" style="background:var(--bg); color:#c4b5fd; font-family:monospace; font-size:0.8125rem; height:120px; margin-bottom:16px;"></textarea>
            <div style="display:flex;gap:8px;margin-bottom:16px;">
                <button class="btn btn-primary" onclick="runCurlTest()">Run Test</button>
                <button class="btn btn-secondary" onclick="copyCurl()">Copy CURL</button>
                <button class="btn btn-secondary" onclick="fetchModels()">Fetch Models</button>
            </div>
            <div id="test-status" class="status-box"></div>
            <pre id="test-response" style="display:none;background:var(--bg);padding:12px;border:1px solid var(--border);border-radius:10px;font-family:monospace;font-size:0.8125rem;color:var(--text-secondary);white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto;"></pre>
            <div id="models-list" class="model-tags"></div>
        </div>
    </div>

    <script>
        const providers = {
            antigravity: { label: 'Anti-Gravity', desc: 'Standard AI' },
            codex: { label: 'Codex', desc: 'OpenAI/GPT' },
            gemini: { label: 'Gemini', desc: 'Google AI' },
            claude: { label: 'Claude', desc: 'Anthropic' },
            xai: { label: 'xAI/Grok', desc: 'Elon AI' },
            kimi: { label: 'Kimi', desc: 'Moonshot' }
        };

        let activeProvider = 'antigravity';
        let authStates = {};

        function initProviderGrid() {
            const grid = document.getElementById('provider-grid');
            grid.innerHTML = Object.entries(providers).map(([id, info]) => `
                <div class="provider-card ${id === activeProvider ? 'active' : ''}" onclick="selectProvider('${id}')">
                    <strong>${info.label}</strong>
                    <span>${info.desc}</span>
                </div>
            `).join('');
        }

        function selectProvider(id) {
            activeProvider = id;
            initProviderGrid();
            document.getElementById('cli-auth-url').value = authStates[id]?.url || '';
            document.getElementById('cli-redirect-url').value = '';
            setAuthStatus('');
        }

        function setAuthStatus(msg, isError = false) {
            const box = document.getElementById('cli-auth-status');
            if (!msg) { box.style.display = 'none'; return; }
            box.style.display = 'block';
            box.textContent = msg;
            box.style.color = isError ? 'var(--error)' : 'var(--success)';
        }

        async function readJson(res) {
            const text = await res.text();
            try { return JSON.parse(text); } catch { throw new Error(text || 'Empty response'); }
        }

        async function loadCliAuthFiles() {
            const tbody = document.getElementById('cli-auth-sessions-table');
            try {
                const res = await fetch('/qaz/auth/sessions');
                const data = await readJson(res);
                const files = data.files || data.auth_files || data;
                
                if (!Array.isArray(files) || !files.length) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-secondary);">No active sessions</td></tr>';
                    return;
                }
                
                tbody.innerHTML = files.map(f => {
                    const isDisabled = f.disabled || f.status === 'disabled';
                    const cooldown = f.next_retry_after ? new Date(f.next_retry_after).toLocaleTimeString() : 'Ready';
                    const account = f.email || f.account || f.id || 'Connected';
                    return `
                        <tr>
                            <td>
                                <div class="toggle-switch">
                                    <input type="checkbox" ${!isDisabled ? 'checked' : ''} onchange="toggleSession('${f.id}', !this.checked)">
                                    <span class="toggle-slider"></span>
                                </div>
                            </td>
                            <td><strong>${f.provider || 'Session'}</strong></td>
                            <td style="color:var(--text-secondary);font-size:0.75rem;">${account}</td>
                            <td style="color:${isDisabled ? 'var(--error)' : 'var(--text-secondary)'}">${isDisabled ? 'Disabled' : cooldown}</td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="4" style="color:var(--error);text-align:center;">${e.message}</td></tr>`;
            }
        }

        async function toggleSession(id, disabled) {
            try {
                await fetch('/qaz/auth/sessions', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, disabled })
                });
                setTimeout(loadCliAuthFiles, 300);
            } catch (e) { alert(e.message); loadCliAuthFiles(); }
        }

        async function startCliAuth() {
            setAuthStatus('Requesting login URL for ' + activeProvider + '...');
            try {
                const res = await fetch(`/cli/auth/${activeProvider}/start`, { method: 'POST' });
                const data = await readJson(res);
                authStates[activeProvider] = { state: data.state, url: data.url };
                document.getElementById('cli-auth-url').value = data.url;
                setAuthStatus('Login URL generated. Open it in your browser.');
            } catch (e) { setAuthStatus(e.message, true); }
        }

        async function copyCliAuthUrl() {
            const url = document.getElementById('cli-auth-url').value;
            if (!url) return;
            await navigator.clipboard.writeText(url);
            setAuthStatus('URL copied to clipboard');
        }

        async function pasteCliRedirectUrl() {
            try {
                document.getElementById('cli-redirect-url').value = await navigator.clipboard.readText();
            } catch (e) { alert('Clipboard permission denied'); }
        }

        async function submitCliRedirect() {
            const redirect = document.getElementById('cli-redirect-url').value.trim();
            if (!redirect) return;
            setAuthStatus('Verifying session...');
            try {
                await fetch(`/cli/auth/${activeProvider}/callback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ redirect_url: redirect })
                });
                setAuthStatus('Session successfully connected!');
                setTimeout(loadCliAuthFiles, 1500);
            } catch (e) { setAuthStatus(e.message, true); }
        }

        function renderCurl() {
            const host = window.location.origin || 'https://kiwa001-kai-api-gateway-cli.hf.space';
            const model = `${activeProvider}-gpt-4o`;
            const curl = `curl ${host}/v1/chat/completions \\
  -H "Content-Type: application/json" \\
  -d '{
    "model": "${model}",
    "messages": [{"role": "user", "content": "Hello!"}]
  }'`;
            document.getElementById('curl-example').value = curl;
        }

        async function copyCurl() {
            const curl = document.getElementById('curl-example').value;
            await navigator.clipboard.writeText(curl);
            setAuthStatus('CURL command copied');
        }

        async function runCurlTest() {
            const status = document.getElementById('test-status');
            const resBox = document.getElementById('test-response');
            const curlText = document.getElementById('curl-example').value;
            
            status.style.display = 'block';
            status.textContent = 'Running test...';
            status.style.color = 'var(--text-secondary)';
            resBox.style.display = 'none';

            let payload = {};
            try {
                const match = curlText.match(/-d\s+'([\s\S]+?)'/);
                if (match) {
                    payload = JSON.parse(match[1]);
                } else {
                    // try parsing the whole thing if it's just JSON
                    payload = JSON.parse(curlText);
                }
            } catch (e) {
                status.textContent = 'Invalid CURL or JSON: ' + e.message;
                status.style.color = 'var(--error)';
                return;
            }

            try {
                const res = await fetch('/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await readJson(res);
                
                status.textContent = res.ok ? 'Test successful!' : 'Test failed (Upstream)';
                status.style.color = res.ok ? 'var(--success)' : 'var(--error)';
                resBox.style.display = 'block';
                resBox.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                status.textContent = 'Request failed: ' + e.message;
                status.style.color = 'var(--error)';
            }
        }

        async function fetchModels() {
            const list = document.getElementById('models-list');
            list.innerHTML = '<span style="font-size:0.75rem;color:var(--text-secondary);">Fetching...</span>';
            try {
                const res = await fetch('/cli/models');
                const data = await readJson(res);
                const models = data.models || data.aliases || [];
                if (!models.length) {
                    list.innerHTML = '<span style="font-size:0.75rem;color:var(--text-secondary);">No models found</span>';
                    return;
                }
                list.innerHTML = models.map(m => `
                    <div class="model-tag" onclick="selectModel('${m.id || m.model}')">${m.id || m.model}</div>
                `).join('');
            } catch (e) {
                list.innerHTML = `<span style="font-size:0.75rem;color:var(--error);">${e.message}</span>`;
            }
        }

        function selectModel(id) {
            const textarea = document.getElementById('curl-example');
            let content = textarea.value;
            // replace the model in the JSON body
            try {
                const match = content.match(/"model":\s*"[^"]*"/);
                if (match) {
                    content = content.replace(/"model":\s*"[^"]*"/, `"model": "${id}"`);
                    textarea.value = content;
                    setAuthStatus(`Model set to ${id}`);
                }
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            initProviderGrid();
            loadCliAuthFiles();
            renderCurl();
        });
    </script>
</body>

</html>
