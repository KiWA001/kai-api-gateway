name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
          lfs: false
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          git config --global user.email "bot@kai-api.com"
          git config --global user.name "KAI Bot"

          DEPLOY_DIR="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$DEPLOY_DIR"

          cd "$DEPLOY_DIR"
          rm -rf .agent .github .vercel
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -name "*.pyc" -delete

          git init -b main
          git config user.email "bot@kai-api.com"
          git config user.name "KAI Bot"
          git add .
          git commit -m "Deploy ${GITHUB_SHA} to Hugging Face"
          git remote add space https://KiWA001:$HF_TOKEN@huggingface.co/spaces/KiWA001/kai-api-gateway
          git push -f space main
